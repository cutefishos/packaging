name: Build ISO

# Build packages starts it after each publish.
on:
  push:
    branches: [main]
    paths:
      - iso/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iso
  cancel-in-progress: false

jobs:
  # Both architectures name their ISO after the same start time.
  stamp:
    name: Build time
    runs-on: ubuntu-24.04
    outputs:
      stamp: ${{ steps.stamp.outputs.stamp }}

    steps:
      - name: Stamp
        id: stamp
        run: echo "stamp=$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

  build:
    name: Debian 13 ${{ matrix.arch }}
    needs: stamp
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /

      - name: Checkout
        uses: actions/checkout@v7

      - name: Name
        env:
          STAMP: ${{ needs.stamp.outputs.stamp }}
        run: |
          version="$(awk '$1 == "cutefish-desktop" { print $2 }' versions)"
          echo "NAME=cutefish-$version-nightly-$STAMP-${{ matrix.arch }}" >> "$GITHUB_ENV"

      - name: Build ISO
        run: |
          docker run --rm --privileged \
            -v "$PWD/iso:/work" \
            -w /work \
            -e NAME \
            debian:trixie \
            bash -euxo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends \
                apt-utils \
                ca-certificates \
                live-build

              ./build.sh "$NAME"
            '
          sudo chown -R "$(id -u):$(id -g)" iso

      - name: Checksums
        run: |
          cd iso
          sha256sum "$NAME.iso" | tee "$NAME.iso.sha256"
          {
            echo "## $NAME.iso"
            echo '```'
            ls -l "$NAME.iso"
            cat "$NAME.iso.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: iso/${{ env.NAME }}.iso

      - name: Upload ISO
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: |
            iso/${{ env.NAME }}.iso
            iso/${{ env.NAME }}.iso.sha256
            iso/${{ env.NAME }}.packages
          if-no-files-found: error
          retention-days: 7

      - name: Publish
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          BUCKET: cutefish-deb
          KEEP: 1
        run: |
          if [[ -z "$R2_ACCOUNT_ID" ]]; then
            echo "R2 is not configured; skipping."
            exit 0
          fi
          s3() { aws s3 --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" "$@"; }

          for file in "$NAME.iso" "$NAME.iso.sha256" "$NAME.packages"; do
            s3 cp "iso/$file" "s3://$BUCKET/iso/nightly/$file"
          done
          echo "$NAME" > LATEST
          s3 cp LATEST "s3://$BUCKET/iso/nightly/LATEST-${{ matrix.arch }}"

          # Only the newest uploads of this architecture stay.
          s3 ls "s3://$BUCKET/iso/nightly/" | awk '/-${{ matrix.arch }}\.iso$/ { print $1 " " $2 " " $4 }' | sort -r \
            | tail -n +$((KEEP + 1)) | while read -r _ _ old; do
                old="${old%.iso}"
                for file in "$old.iso" "$old.iso.sha256" "$old.packages"; do
                  s3 rm "s3://$BUCKET/iso/nightly/$file"
                done
              done
          s3 ls "s3://$BUCKET/iso/nightly/"

  # The front page lists the newest ISO of every architecture.
  pages:
    name: Front page
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Publish
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          BUCKET: cutefish-deb
        run: |
          if [[ -z "$R2_ACCOUNT_ID" ]]; then
            echo "R2 is not configured; skipping."
            exit 0
          fi
          web/publish.sh "$BUCKET"
